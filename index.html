<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&amp;family=Noto+Sans+Devanagari:wght@400;600;700&amp;display=swap">
<title>Santosh Mobile Center</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14182a;--mu:#63697e;--br:#e3e6ef;--pr:#d81e3c;--ok:#0f9d58;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e111a;--card:#171b28;--tx:#eef0f7;--mu:#98a0b8;--br:#262b3d;--pr:#ff5a73;--ok:#3ddc84;--no:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e111a;--card:#171b28;--tx:#eef0f7;--mu:#98a0b8;--br:#262b3d;--pr:#ff5a73;--ok:#3ddc84;--no:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#b3122d,#d81e3c 60%,#1c3f94);color:#fff;padding:22px 16px 26px;text-align:center}
header h1{margin:0;font-size:1.7rem}header p{margin:4px 0 0;opacity:.92}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--br);border-radius:10px;padding:10px;width:100%}
.bar input{flex:1 1 200px;width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;white-space:nowrap;cursor:pointer;font:inherit}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.live{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.9rem;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}@keyframes p{50%{opacity:.3}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:3rem}
.img img{width:100%;height:100%;object-fit:contain}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:1rem}.sp{color:var(--mu);font-size:.85rem}
.pr{font-size:1.25rem;font-weight:700;color:var(--pr)}.old{text-decoration:line-through;color:var(--mu);font-size:.85rem;margin-left:6px;font-weight:400}
.st{font-size:.8rem;font-weight:600}.in{color:var(--ok)}.out{color:var(--no)}
.btn{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;background:var(--pr);color:#fff;text-decoration:none;text-align:center;display:inline-block}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--br)}.btn.d{background:var(--no)}
.row{display:flex;gap:6px;margin-top:auto;padding-top:8px}.row>*{flex:1}
.owner{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#111;color:#fff;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:.9rem}
.owner .btn{padding:6px 10px}
header{position:relative}.lg{position:absolute;right:12px;top:12px;border:1px solid #fff8;background:#0003;color:#fff;border-radius:99px;padding:6px 12px;font:inherit;cursor:pointer}
.tab{font-weight:600}.h{font-size:1.15rem;margin:16px 0 8px}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.hs .card{min-width:200px;max-width:200px}
.img{position:relative}.tags{position:absolute;top:8px;left:8px;display:flex;gap:4px}.tg{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}.tg.n{background:var(--pr)}.tg.e{background:#1c3f94}
footer{text-align:center;color:var(--mu);padding:20px 14px 30px;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:8px}
.sheet label{font-size:.85rem;color:var(--mu)}.sheet h2{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{width:90px;height:90px;object-fit:contain;background:var(--card);border-radius:10px;border:1px solid var(--br)}
.empty{text-align:center;color:var(--mu);padding:30px}

body{font-family:Poppins,"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:34px 16px 46px;background:radial-gradient(circle at 15% 20%,#ff5a73 0,transparent 40%),radial-gradient(circle at 85% 80%,#3b6cf0 0,transparent 45%),linear-gradient(135deg,#8d0f25,#d81e3c 55%,#1c3f94);overflow:hidden;position:relative;border-radius:0 0 32px 32px}
header:before,header:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff14;animation:fl 8s ease-in-out infinite}
header:before{left:-50px;top:-60px}header:after{right:-40px;bottom:-70px;animation-delay:-4s}@keyframes fl{50%{transform:translateY(16px) scale(1.08)}}
header h1{font-size:2rem;font-weight:800;letter-spacing:-.5px;position:relative;text-shadow:0 2px 12px #0004}header p{position:relative;font-size:.95rem}
.badge{display:inline-block;background:#ffffff26;backdrop-filter:blur(6px);border:1px solid #ffffff55;border-radius:99px;padding:4px 14px;font-size:.78rem;margin-bottom:10px;position:relative}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:1000px;margin:-24px auto 0;padding:0 14px;position:relative;z-index:2}
.trust div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px #0002;font-size:.82rem;font-weight:600;display:flex;gap:8px;align-items:center}.trust span{font-size:1.4rem}
.tick{overflow:hidden;white-space:nowrap;background:#14182a;color:#ffd54a;font-size:.85rem;font-weight:600;padding:7px 0;margin-top:16px}
.tick div{display:inline-block;padding-left:100%;animation:tk 28s linear infinite}@keyframes tk{to{transform:translateX(-100%)}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;padding:8px 0;background:var(--bg)}
.bar input{border-radius:99px;padding:12px 18px;box-shadow:0 4px 14px #0001;border:2px solid transparent}.bar input:focus{outline:0;border-color:var(--pr)}
.chip{transition:.2s}.chip:hover{transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,#d81e3c,#ff5a73);box-shadow:0 4px 12px #d81e3c55}
.tab{padding:9px 18px}
.card{border-radius:20px;border:0;box-shadow:0 6px 20px #0000001a;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 34px #d81e3c33}
.img{background:linear-gradient(160deg,#fde8ec,#e6edff);padding:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .img{background:linear-gradient(160deg,#2a1c25,#1a2340)}}
.img img{transition:transform .35s}.card:hover .img img{transform:scale(1.07)}
.pr{display:inline-block;background:linear-gradient(135deg,#d81e3c,#ff5a73);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;font-size:1.3rem}
.off{position:absolute;top:8px;right:8px;background:#0f9d58;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px}
.btn{border-radius:12px;transition:.2s}.btn:not(.g):not(.d){background:linear-gradient(135deg,#d81e3c,#ff5a73);box-shadow:0 4px 12px #d81e3c44}.btn:active{transform:scale(.96)}
.h{font-weight:800;border-left:5px solid var(--pr);padding-left:10px}
footer{background:#14182a;color:#c9cee0;margin-top:30px;border-radius:28px 28px 0 0;padding:28px 16px 90px}footer b{color:#fff;font-size:1.1rem}
.wafab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;font-size:1.7rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #0006;text-decoration:none;z-index:6;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #25d36699}70%{box-shadow:0 0 0 16px #25d36600}100%{box-shadow:0 0 0 0 #25d36600}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.so{width:auto;border-radius:99px;padding:10px 14px}.mp{display:inline-block;margin:8px 0;color:#fff!important}.row .sh{flex:0 0 44px}.bd{font-size:.85rem}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.rc{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px;box-shadow:0 6px 20px #0000001a}.ri{font-size:2rem;width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,#fde8ec,#e6edff);display:flex;align-items:center;justify-content:center;flex:none}.rc .btn{flex:none;font-size:.85rem}.col{display:flex;flex-direction:column;gap:6px}
.num{font-weight:700;font-size:1.05rem;letter-spacing:.5px;word-break:break-all}
.ol{color:#8a90a8;font-size:.75rem;text-decoration:none;display:inline-block;margin-top:10px}
.add{width:100%;margin-top:8px}.cartfab{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:99px;padding:14px 18px;background:linear-gradient(135deg,#14182a,#3b4470);color:#fff;font:inherit;font-weight:700;box-shadow:0 6px 20px #0006;cursor:pointer}.ci{display:flex;gap:6px;align-items:center;background:var(--card);border-radius:12px;padding:8px}.qb{padding:4px 10px;flex:none}.tot{text-align:right;font-size:1.1rem}
.ban img{display:block;width:100%;height:auto}
.clk{position:relative;font-size:.85rem;margin-top:8px;font-weight:600;opacity:.95}
</style>
</head>

const cartTotal=()=>cartItems().reduce((a,x)=>a+x.p.price*x.n,0);
function cartFab(){if(owner)return '';const n=cartItems().reduce((a,x)=>a+x.n,0);return n?`<button class="cartfab" id="cf">🛒 ${n} · ${rs(cartTotal())}</button>`:''}
function bindCart(){const b=$('#cartbox');if(!b)return;b.innerHTML=cartFab();const c=$('#cf');if(c)c.onclick=openCart}
function openCart(){
 const m=modal(''),v={n:'',p:'',d:'pk',a:'',m:''};
 const draw=()=>{
  const t=T[lang],it=cartItems(),sh=m.querySelector('.sheet');
  if(!it.length){sh.innerHTML=`<h2>${t.c_cart}</h2><div class="empty">${t.c_empty}</div><button class="btn g" id="cx">OK</button>`;sh.querySelector('#cx').onclick=()=>{m.remove();bindCart()};return}
  sh.innerHTML=`<h2>${t.c_cart}</h2>${it.map(x=>`<div class="ci"><div style="flex:1;min-width:0"><b>${esc(x.p.brand)} ${esc(x.p.name)}</b><div class="sp">${rs(x.p.price)}</div></div><button class="btn g qb" data-m="${x.p.id}">−</button><b>${x.n}</b><button class="btn g qb" data-p="${x.p.id}">+</button><button class="btn d qb" data-r="${x.p.id}">✕</button></div>`).join('')}
  <div class="tot">${t.c_total}: <b>${rs(cartTotal())}</b></div>
  <input id="cn" placeholder="${t.c_yn}" value="${esc(v.n)}"><input id="cp" type="tel" inputmode="numeric" placeholder="${t.c_yp}" value="${esc(v.p)}">
  <select id="cd"><option value="pk" ${v.d==='pk'?'selected':''}>${t.c_pk}</option><option value="dl" ${v.d==='dl'?'selected':''}>${t.c_dl}</option></select>
  <input id="ca" placeholder="${t.c_ad}" value="${esc(v.a)}" style="display:${v.d==='dl'?'block':'none'}">
  <select id="cm">${(S.pay||[]).map(y=>`<option ${v.m===y.name?'selected':''}>${esc(y.name)}</option>`).join('')}</select>
  <input id="ct" placeholder="${t.c_tx}" value="${esc(v.t||'')}"><div class="sp">${t.c_note}</div>
  <div class="two"><button class="btn g" id="cx">OK</button><button class="btn" id="cs">${t.c_send}</button></div>`;
  const keep=()=>{v.n=sh.querySelector('#cn').value;v.p=sh.querySelector('#cp').value;v.d=sh.querySelector('#cd').value;v.a=sh.querySelector('#ca').value;const mm=sh.querySelector('#cm');v.m=mm?mm.value:'';const ctt=sh.querySelector('#ct');v.t=ctt?ctt.value:''};
  const chg=(id,dl)=>{keep();cart[id]=(cart[id]||0)+dl;if(cart[id]<=0)delete cart[id];saveCart();bindCart();draw()};
  sh.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>chg(b.dataset.m,-1));
  sh.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>chg(b.dataset.p,1));
  sh.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>chg(b.dataset.r,-999));
  sh.querySelector('#cd').onchange=()=>{keep();draw()};
  sh.querySelector('#cx').onclick=()=>{keep();m.remove();bindCart()};
  sh.querySelector('#cs').onclick=()=>{keep();
   if(!v.n.trim()||v.p.replace(/\D/g,'').length<7)return alert(lang==='en'?'Please enter your name and phone number':'कृपया नाम र फोन नम्बर लेख्नुहोस्');
   if(v.d==='dl'&&!v.a.trim())return alert(lang==='en'?'Please enter delivery address':'कृपया ठेगाना लेख्नुहोस्');
   const lines=it.map((x,i)=>(i+1)+'. '+x.p.brand+' '+x.p.name+' x'+x.n+' — '+rs(x.p.price*x.n));
   const oid='SM'+Date.now().toString(36).toUpperCase(),od={id:oid,name:v.n.trim(),phone:v.p.trim(),txn:(v.t||'').trim(),pay:v.m||'-',total:cartTotal(),items:it.map(x=>x.p.brand+' '+x.p.name+' x'+x.n),time:new Date().toISOString(),status:'pending'},code=btoa(unescape(encodeURIComponent(JSON.stringify(od))));const msg='New order from website — '+S.shop.name+'\n'+lines.join('\n')+'\nTotal: '+rs(cartTotal())+'\nPayment: '+(v.m||'-')+'\nName: '+v.n.trim()+'\nPhone: '+v.p.trim()+'\n'+(v.d==='dl'?'Delivery: '+v.a.trim():'Pick up at store');
   window.open('https://wa.me/977'+S.shop.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg+(od.txn?'\nTxn: '+od.txn:'')+'\nOrder: #'+oid+'\nCODE:'+code),'_blank');
   cart={};saveCart();m.remove();bindCart();doneBox(oid,od)};
 };
 draw();
}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet">'+html+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function form(id){
 const p=S.phones.find(x=>x.id===id)||{id:'p'+Date.now(),cat:'Smartphone',brand:'',name:'',spec:'',price:'',old:0,stock:true,isNew:true,img:''};const isNew=!S.phones.includes(p);
 const yn=(v)=>`<option value="1" ${v?'selected':''}>Yes</option><option value="0" ${v?'':'selected'}>No</option>`;
 const m=modal(`<h2>${isNew?'Add item':'Edit item'}</h2>
 <div style="display:flex;gap:10px;align-items:center"><img class="pv" id="pv" src="${p.img||''}" alt=""><div style="flex:1"><label>Picture (फोटो)</label><input type="file" id="f" accept="image/*"></div></div>
 <label>Category</label><select id="ct">${CATS.map(c=>`<option value="${c}" ${p.cat===c?'selected':''}>${T.en[c]}</option>`).join('')}</select>
 <div class="two"><div><label>Brand</label><input id="b" value="${esc(p.brand)}"></div><div><label>Model</label><input id="n" value="${esc(p.name)}"></div></div>
 <label>Specs</label><input id="sp" value="${esc(p.spec)}">
 <div class="two"><div><label>Price (Rs.)</label><input id="pr" type="number" inputmode="numeric" value="${p.price}"></div><div><label>Old price (optional)</label><input id="op" type="number" inputmode="numeric" value="${p.old||''}"></div></div>
 <div class="two"><div><label>In stock?</label><select id="st">${yn(p.stock)}</select></div><div><label>New arrival?</label><select id="nw">${yn(p.isNew)}</select></div></div>
  <div class="two"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Done</button></div>`);
 m.querySelector('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);p.img=c.toDataURL('image/jpeg',.78);m.querySelector('#pv').src=p.img};i.src=r.result};r.readAsDataURL(f)};
 m.querySelector('#x').onclick=()=>m.remove();
 m.querySelector('#ok').onclick=()=>{const g=s=>m.querySelector(s).value;if(!g('#n').trim()||!g('#pr'))return alert('Model and price required');
  Object.assign(p,{cat:g('#ct'),brand:g('#b').trim()||'Other',name:g('#n').trim(),spec:g('#sp').trim(),price:+g('#pr'),old:+g('#op')||0,stock:g('#st')==='1',isNew:g('#nw')==='1'});
  if(isNew)S.phones.unshift(p);dirty=true;m.remove();render()};
}
function shopForm(){
 const m=modal(`<h2>Shop info</h2>${[['name','Shop name'],['tag','Tagline'],['phone','Phone (10 digits)'],['address','Address'],['phone2','Second phone'],['pan','PAN number'],['hours','Opening hours'],['map','Google Maps link']].map(([k,l])=>`<label>${l}</label><input data-k="${k}" value="${esc(S.shop[k])}">`).join('')}<label>New owner password (leave empty to keep)</label><input id="npw" type="password"><label>Top banner picture</label><input type="file" id="bf" accept="image/*"><div class="two"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Done</button></div>`);
 m.querySelector('#bf').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1200/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.shop.banner=c.toDataURL('image/jpeg',.8)};i.src=fr.result};fr.readAsDataURL(f)};
 m.querySelector('#x').onclick=()=>m.remove();
 m.querySelector('#ok').onclick=async()=>{m.querySelectorAll('[data-k]').forEach(i=>S.shop[i.dataset.k]=i.value);const np=m.querySelector('#npw').value;if(np)S.shop.hash=await sha(np);dirty=true;m.remove();render()};
}
async function save(){
  S.shop.updated=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
 const c=document.documentElement.cloneNode(true);c.querySelector('#root').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 const html='<!DOCTYPE html>\n'+c.outerHTML;
 const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';a.click();dirty=false;render();alert('Downloaded index.html - upload it to GitHub to update the live site.')};
 if(!artifact)return dl();
 try{await artifact.publish(html)}catch(e){if(e&&e.code!=='conflict')dl()}
}
render();
(async()=>{try{artifact=await claude.use('artifact')}catch(e){}})();
setInterval(()=>{const c=$('#clk');if(c)c.textContent=clk();const st=$('#st');if(st)st.textContent=stHtml()},1000);
</script>
